apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: semantic-router-demo
  namespace: models
  labels:
    app: semantic-router-demo-ui
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    # This Route carries the proxied /v1 traffic too, so it needs the same
    # generous timeout as the router's own Route.
    haproxy.router.openshift.io/timeout: "300s"
spec:
  to:
    kind: Service
    name: semantic-router-demo-ui
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
