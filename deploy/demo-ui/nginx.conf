# Serves the demo console and reverse-proxies the router API under the same
# origin, so the browser never issues a cross-origin request during a live
# demo. (The router's Envoy also has a permissive CORS policy, which is what
# makes the console work when you open it from somewhere else.)
#
# Everything writable lives under /tmp because OpenShift runs this pod with an
# arbitrary, non-root UID.

pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;
        root /opt/app-root/src;
        index index.html;

        # Never cache the console itself — a presenter editing use cases and
        # re-deploying should see the change on reload, not a stale copy.
        location / {
            add_header Cache-Control "no-store";
            try_files $uri $uri/ /index.html;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Chat completions and model list. Generous timeouts: a cold model plus
        # a reasoning pass can take well over a minute.
        location /v1/ {
            proxy_pass http://semantic-router.models.svc.cluster.local:80/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            proxy_buffering off;
        }

        # Classification API — lets the console show why a decision was made.
        location /api/ {
            proxy_pass http://semantic-router.models.svc.cluster.local:80/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        location /metrics {
            proxy_pass http://semantic-router.models.svc.cluster.local:80/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }
    }
}
