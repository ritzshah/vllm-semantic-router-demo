# Envoy sidecar for the semantic router.
#
# Request path for a chat completion:
#   client -> listener :8801
#          -> cors filter          (short-circuits OPTIONS preflight)
#          -> ext_proc filter      (gRPC to the router on 127.0.0.1:50051)
#               router classifies the prompt, picks a model, and sets the
#               x-vsr-destination-endpoint request header to "IP:port"
#          -> router filter        -> vllm_dynamic_cluster (ORIGINAL_DST)
#               Envoy dials the address in that header directly
#
# ORIGINAL_DST does not perform DNS resolution, which is why the router config
# must carry backend ClusterIPs rather than Service hostnames.
#
# The CORS policy is what lets the demo console run from somewhere other than
# this Route (a laptop file:// page, GitHub Pages, another cluster). When the
# console is served by the in-cluster demo-ui pod it is same-origin and CORS is
# not consulted at all.
apiVersion: v1
kind: ConfigMap
metadata:
  name: semantic-router-envoy-config
  namespace: models
  labels:
    app: semantic-router
    component: envoy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: listener_0
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 8801
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              access_log:
              - name: envoy.access_loggers.stdout
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                  log_format:
                    text_format: "status=%RESPONSE_CODE% total_ms=%DURATION% upstream_ms=%RESP(x-envoy-upstream-service-time)% cluster=%UPSTREAM_CLUSTER% vsr=%REQ(x-vsr-destination-endpoint)% method=%REQ(:METHOD)% path=%REQ(:PATH)%\n"
              route_config:
                name: local_route
                virtual_hosts:
                - name: local_service
                  domains: ["*"]
                  typed_per_filter_config:
                    envoy.filters.http.cors:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                      allow_origin_string_match:
                      - safe_regex:
                          regex: ".*"
                      allow_methods: "GET, POST, OPTIONS"
                      allow_headers: "content-type,authorization,accept,x-request-id,x-vsr-destination-endpoint"
                      expose_headers: "x-vsr-selected-model,x-vsr-selected-category,x-vsr-selected-reasoning,x-vsr-selected-decision,x-vsr-cache-hit,x-vsr-injected-system-prompt,x-vsr-destination-endpoint,x-envoy-upstream-service-time"
                      max_age: "86400"
                  routes:
                  # Classification API, health and model list are served by the
                  # router's own HTTP listener. ext_proc is disabled on these so
                  # a metrics scrape or a health probe never triggers a
                  # classification pass.
                  - match:
                      path: "/v1/models"
                    route:
                      cluster: semantic_router_cluster
                      timeout: 30s
                    typed_per_filter_config:
                      envoy.filters.http.ext_proc:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                        disabled: true
                  - match:
                      prefix: "/api/"
                    route:
                      cluster: semantic_router_cluster
                      timeout: 60s
                    typed_per_filter_config:
                      envoy.filters.http.ext_proc:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                        disabled: true
                  - match:
                      prefix: "/health"
                    route:
                      cluster: semantic_router_cluster
                      timeout: 10s
                    typed_per_filter_config:
                      envoy.filters.http.ext_proc:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                        disabled: true
                  - match:
                      prefix: "/metrics"
                    route:
                      cluster: semantic_router_metrics_cluster
                      timeout: 10s
                    typed_per_filter_config:
                      envoy.filters.http.ext_proc:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                        disabled: true
                  # Everything else (notably /v1/chat/completions) goes through
                  # ext_proc and then to whichever backend the router selected.
                  - match:
                      prefix: "/"
                    route:
                      cluster: vllm_dynamic_cluster
                      timeout: 300s
              http_filters:
              - name: envoy.filters.http.cors
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
              - name: envoy.filters.http.ext_proc
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                  grpc_service:
                    envoy_grpc:
                      cluster_name: extproc_service
                  allow_mode_override: true
                  processing_mode:
                    request_header_mode: "SEND"
                    response_header_mode: "SEND"
                    request_body_mode: "BUFFERED"
                    response_body_mode: "BUFFERED"
                    request_trailer_mode: "SKIP"
                    response_trailer_mode: "SKIP"
                  failure_mode_allow: true
                  message_timeout: 300s
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
      - name: extproc_service
        connect_timeout: 300s
        type: STATIC
        lb_policy: ROUND_ROBIN
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          cluster_name: extproc_service
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 50051

      - name: semantic_router_cluster
        connect_timeout: 30s
        type: STATIC
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: semantic_router_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 8080

      - name: semantic_router_metrics_cluster
        connect_timeout: 10s
        type: STATIC
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: semantic_router_metrics_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 9190

      - name: vllm_dynamic_cluster
        connect_timeout: 300s
        type: ORIGINAL_DST
        lb_policy: CLUSTER_PROVIDED
        original_dst_lb_config:
          use_http_header: true
          http_header_name: "x-vsr-destination-endpoint"

    admin:
      address:
        socket_address:
          address: "127.0.0.1"
          port_value: 19000
