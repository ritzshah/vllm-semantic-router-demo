# Envoy sidecar for the semantic router.
#
# Request path for a chat completion:
#   client -> listener :8801
#          -> cors filter      (short-circuits OPTIONS preflight)
#          -> ext_proc filter  (gRPC to the router on 127.0.0.1:50051)
#               the router classifies the prompt, picks a model, and sets the
#               x-selected-model request header to that model's name
#          -> router filter    -> the named cluster whose route matches that header
#
# HOW v0.3 PICKS A BACKEND — this changed, and the old shape fails silently.
#
# Earlier builds used a single ORIGINAL_DST cluster and had the router write an
# "IP:port" into x-vsr-destination-endpoint. That header no longer exists; v0.3
# instead sets x-selected-model to the *logical model name* and expects Envoy to
# own one named cluster per model. This layout mirrors the template the project
# ships at /app/cli/templates/envoy.template.yaml in the extproc image.
#
# The failure mode if you keep the old shape is nasty: guardrail blocks and
# cache hits keep working, because the router answers those itself and never
# reaches a cluster. Only requests that need a model fail, with
# "503 no healthy upstream". Half the demo looks perfect.
#
# Two consequences of named clusters, both good:
#   - They resolve DNS (STRICT_DNS), so backends are Service names rather than
#     ClusterIPs. No IP substitution at deploy time, and nothing to re-wire
#     when a model is redeployed.
#   - Adding a third model is a route + cluster pair here and a providers entry
#     in the router config. No Envoy restart semantics to think about.
#
# Route order matters — Envoy takes the first match. The router's own API paths
# are listed before the model routes, with ext_proc disabled so a health probe
# or a metrics scrape never triggers a classification pass.
apiVersion: v1
kind: ConfigMap
metadata:
  name: semantic-router-envoy-config
  namespace: models
  labels:
    app: semantic-router
    component: envoy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: listener_0
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 8801
        perConnectionBufferLimitBytes: 524288000
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              codec_type: AUTO
              stream_idle_timeout: 300s
              access_log:
              - name: envoy.access_loggers.stdout
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                  log_format:
                    text_format: "status=%RESPONSE_CODE% total_ms=%DURATION% upstream_ms=%RESP(x-envoy-upstream-service-time)% cluster=%UPSTREAM_CLUSTER% host=%UPSTREAM_HOST% selected=%REQ(x-selected-model)% model=%RESP(x-vsr-selected-model)% decision=%RESP(x-vsr-selected-decision)% cache=%RESP(x-vsr-cache-hit)% method=%REQ(:METHOD)% path=%REQ(:PATH)%\n"
              route_config:
                name: local_route
                virtual_hosts:
                - name: local_service
                  domains: ["*"]
                  # Internal headers a client must never be able to supply.
                  request_headers_to_remove:
                  - "x-selected-model"
                  - "x-vsr-looper-request"
                  - "x-vsr-looper-secret"
                  - "x-vsr-looper-decision"
                  - "x-vsr-looper-iteration"
                  - "x-authz-user-id"
                  - "x-authz-user-groups"
                  typed_per_filter_config:
                    envoy.filters.http.cors:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                      allow_origin_string_match:
                      - safe_regex:
                          regex: ".*"
                      allow_methods: "GET, POST, OPTIONS"
                      allow_headers: "content-type,authorization,accept,x-request-id"
                      expose_headers: "x-vsr-selected-model,x-vsr-selected-category,x-vsr-selected-decision,x-vsr-selected-reasoning,x-vsr-selected-algorithm,x-vsr-selected-confidence,x-vsr-cache-hit,x-vsr-routing-latency-ms,x-envoy-upstream-service-time"
                      max_age: "86400"
                  routes:
                  # --- the router's own API, ext_proc disabled ---------------
                  - match:
                      path: "/v1/models"
                    route:
                      cluster: semantic_router_cluster
                      timeout: 30s
                    typed_per_filter_config:
                      envoy.filters.http.ext_proc:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                        disabled: true
                  - match:
                      prefix: "/api/"
                    route:
                      cluster: semantic_router_cluster
                      timeout: 60s
                    typed_per_filter_config:
                      envoy.filters.http.ext_proc:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                        disabled: true
                  - match:
                      prefix: "/health"
                    route:
                      cluster: semantic_router_cluster
                      timeout: 10s
                    typed_per_filter_config:
                      envoy.filters.http.ext_proc:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                        disabled: true
                  - match:
                      prefix: "/metrics"
                    route:
                      cluster: semantic_router_metrics_cluster
                      timeout: 10s
                    typed_per_filter_config:
                      envoy.filters.http.ext_proc:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                        disabled: true

                  # --- one route per model, keyed on x-selected-model --------
                  # ext_proc sets this header; the virtual host strips any copy
                  # the client sent, so it can only come from the router.
                  - match:
                      prefix: "/"
                      headers:
                      - name: x-selected-model
                        string_match:
                          exact: "qwen-25-7b"
                    route:
                      cluster: qwen_cluster
                      timeout: 300s
                      auto_host_rewrite: true
                  - match:
                      prefix: "/"
                      headers:
                      - name: x-selected-model
                        string_match:
                          exact: "phi-3-mini-chat"
                    route:
                      cluster: phi_cluster
                      timeout: 300s
                      auto_host_rewrite: true

                  # --- default ----------------------------------------------
                  # No x-selected-model: fall through to the small model, which
                  # matches default_model in the router config. An unrecognised
                  # request costs the cheap model, never the expensive one.
                  - match:
                      prefix: "/"
                    route:
                      cluster: phi_cluster
                      timeout: 300s
                      auto_host_rewrite: true
              http_filters:
              - name: envoy.filters.http.cors
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
              - name: envoy.filters.http.ext_proc
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                  grpc_service:
                    envoy_grpc:
                      cluster_name: extproc_service
                  allow_mode_override: true
                  processing_mode:
                    request_header_mode: "SEND"
                    response_header_mode: "SEND"
                    request_body_mode: "BUFFERED"
                    response_body_mode: "BUFFERED"
                    request_trailer_mode: "SKIP"
                    response_trailer_mode: "SKIP"
                  message_timeout: 300s
                  # The router passes a decision's reliability block to Envoy's
                  # router as these per-request headers; it may set no other
                  # x-envoy-* header.
                  mutation_rules:
                    allow_expression:
                      regex: "^x-envoy-(upstream-rq-timeout-ms|upstream-rq-per-try-timeout-ms|max-retries|retry-on|retriable-status-codes)$"
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
      - name: extproc_service
        connect_timeout: 300s
        type: STATIC
        lb_policy: ROUND_ROBIN
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          cluster_name: extproc_service
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 50051

      - name: semantic_router_cluster
        connect_timeout: 30s
        type: STATIC
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: semantic_router_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 8080

      - name: semantic_router_metrics_cluster
        connect_timeout: 10s
        type: STATIC
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: semantic_router_metrics_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 9190

      # --- backends -------------------------------------------------------
      # STRICT_DNS, so these are Service names and not ClusterIPs. Envoy
      # re-resolves on its own, which means a model redeploy needs no change
      # here and no re-wiring of the router config.
      - name: qwen_cluster
        connect_timeout: 10s
        type: STRICT_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: qwen_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: qwen-25-7b-predictor-stable.models.svc.cluster.local
                    port_value: 8080
                hostname: "qwen-25-7b-predictor-stable.models.svc.cluster.local"

      - name: phi_cluster
        connect_timeout: 10s
        type: STRICT_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: phi_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: phi-3-mini-chat-predictor-stable.models.svc.cluster.local
                    port_value: 8080
                hostname: "phi-3-mini-chat-predictor-stable.models.svc.cluster.local"

    admin:
      address:
        socket_address:
          address: "127.0.0.1"
          port_value: 19000
