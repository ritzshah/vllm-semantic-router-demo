apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: models
# `oc apply -k` works directly here — backends are Service DNS names and
# nothing needs substituting. Prefer scripts/apply-router.sh though: it
# validates the config first and restarts the router only when the content
# actually changed (the ConfigMap name is stable, so nothing else would).
resources:
  - 01-serviceaccount.yaml
  - 02-pvcs.yaml
  - 03-configmap-router.yaml
  - 04-configmap-envoy.yaml
  - 05-deployment.yaml
  - 06-service.yaml
  - 07-route.yaml
