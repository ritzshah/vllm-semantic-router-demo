apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-router
  namespace: models
  labels:
    app: semantic-router
    component: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: semantic-router
      component: gateway
  # Recreate, not RollingUpdate: both PVCs are ReadWriteOnce, so a second pod
  # would block on volume attachment and the rollout would never finish.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: semantic-router
        component: gateway
    spec:
      serviceAccountName: semantic-router
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # No init container. Earlier versions of this demo pre-pulled four
      # ModernBERT classifiers and MiniLM, and aliased MiniLM to
      # mom-embedding-light to dodge a gated default. The v0.3 router uses the
      # Vela-1.0-Encoder-307M family instead and fetches it through its own
      # model runtime on first start, so pre-staging those files only consumed
      # several GB of the PVC and was never read.
      #
      # First start therefore downloads ~5 GB inside the router container and
      # takes a few minutes. The startup probe below allows up to 10.
      containers:
      - name: semantic-router
        image: ghcr.io/vllm-project/semantic-router/extproc:latest
        imagePullPolicy: Always
        env:
        - name: LD_LIBRARY_PATH
          value: /app/lib
        - name: HF_HOME
          value: /app/cache/hf
        - name: TRANSFORMERS_CACHE
          value: /app/cache/transformers
        - name: SENTENCE_TRANSFORMERS_HOME
          value: /app/cache/sentence_transformers
        - name: XDG_CACHE_HOME
          value: /app/cache/xdg
        - name: HOME
          value: /tmp/home
        ports:
        - name: grpc
          containerPort: 50051
        - name: metrics
          containerPort: 9190
        - name: classify-api
          containerPort: 8080
        # The model runtime starts one CPU process per Vela model and, on a
        # cold volume, downloads them first. The startup probe allows up to 10
        # minutes before the kubelet decides the container is broken.
        startupProbe:
          tcpSocket:
            port: 50051
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: 50051
          periodSeconds: 10
          timeoutSeconds: 3
        # v0.3 does not load the classifiers in-process. Its model runtime
        # forks a separate float32 Python server per model — prompt_guard,
        # pii_classifier, domain_classifier, the primary embedding and
        # @embedding.mmbert — each listening on its own unix socket. Five
        # processes do not fit in the 8Gi that the old single-process build
        # needed, and the failure mode is a bare exit 137 / OOMKilled partway
        # through loading the last one.
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
          limits:
            cpu: "6"
            memory: 20Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        - name: models-volume
          mountPath: /app/models
        - name: cache-volume
          mountPath: /app/cache
      - name: envoy-proxy
        image: envoyproxy/envoy:v1.35.3
        command: ["/usr/local/bin/envoy"]
        args:
        - -c
        - /etc/envoy/envoy.yaml
        - --component-log-level
        - ext_proc:info,router:info,http:info
        ports:
        - name: envoy-http
          containerPort: 8801
        - name: envoy-admin
          containerPort: 19000
        readinessProbe:
          tcpSocket:
            port: 8801
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: envoy-config-volume
          mountPath: /etc/envoy
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: semantic-router-config
      - name: envoy-config-volume
        configMap:
          name: semantic-router-envoy-config
      - name: models-volume
        persistentVolumeClaim:
          claimName: semantic-router-models
      - name: cache-volume
        persistentVolumeClaim:
          claimName: semantic-router-cache
