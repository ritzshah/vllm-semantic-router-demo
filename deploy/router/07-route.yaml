apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: semantic-router
  namespace: models
  labels:
    app: semantic-router
    component: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # Classifier passes plus generation can take a while on a cold model.
    haproxy.router.openshift.io/timeout: "300s"
spec:
  to:
    kind: Service
    name: semantic-router
    weight: 100
  port:
    targetPort: envoy-http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
