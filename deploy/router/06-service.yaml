apiVersion: v1
kind: Service
metadata:
  name: semantic-router
  namespace: models
  labels:
    app: semantic-router
    component: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    app: semantic-router
    component: gateway
  ports:
    # Everything the demo needs goes through envoy-http: /v1/chat/completions,
    # /v1/models, /api/..., /health and /metrics are all routed by Envoy.
    - name: envoy-http
      port: 80
      targetPort: 8801
    - name: classify-api
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9190
      targetPort: 9190
