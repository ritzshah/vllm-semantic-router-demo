# A second, small GPU node so the two models can each have a dedicated GPU.
#
# The demo needs two schedulable GPUs: Qwen-2.5-7B on the large one and
# Phi-3-mini on this T4. The alternative — time-slicing a single large GPU —
# avoids the extra instance but makes the two models share memory bandwidth,
# which muddies the latency comparison the demo is built around.
#
# This file is cluster-specific. Before applying it elsewhere, replace:
#   - the infrastructure ID (ocp-7hktt) everywhere it appears
#   - ami.id            with the AMI your other worker machinesets use
#   - the region / availability zone
#   - the subnet and security group filter values
#   - the Stack / guid / uuid tags
#
# Derive them by copying an existing machineset:
#   oc get machineset -n openshift-machine-api
#   oc get machineset <an-existing-gpu-machineset> -n openshift-machine-api -o yaml
#
# g4dn.2xlarge = 1x NVIDIA T4 (16 GB), 8 vCPU, 32 GB RAM.
#
# IMPORTANT: the T4 is Turing (compute capability 7.5) and has no native
# bfloat16. Any vLLM server scheduled here must run with --dtype float16 —
# see deploy/models/phi3-inferenceservice.yaml.
apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  name: ocp-7hktt-worker-gpu-t4-us-east-2a
  namespace: openshift-machine-api
  labels:
    agnosticd.redhat.com/machineset-group: worker-gpu-t4
    machine.openshift.io/cluster-api-cluster: ocp-7hktt
  annotations:
    capacity.cluster-autoscaler.kubernetes.io/labels: kubernetes.io/arch=amd64
    machine.openshift.io/GPU: "1"
    machine.openshift.io/memoryMb: "32768"
    machine.openshift.io/vCPU: "8"
spec:
  replicas: 1
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: ocp-7hktt
      machine.openshift.io/cluster-api-machineset: ocp-7hktt-worker-gpu-t4-us-east-2a
  template:
    metadata:
      labels:
        agnosticd.redhat.com/machineset-group: worker-gpu-t4
        machine.openshift.io/cluster-api-cluster: ocp-7hktt
        machine.openshift.io/cluster-api-machine-role: worker-gpu
        machine.openshift.io/cluster-api-machine-type: worker-gpu
        machine.openshift.io/cluster-api-machineset: ocp-7hktt-worker-gpu-t4-us-east-2a
    spec:
      lifecycleHooks: {}
      metadata:
        labels:
          node-role.kubernetes.io/worker-gpu: ""
      # Same taint key as the existing GPU nodes, different value. Both
      # InferenceServices tolerate the key with operator: Exists, so they
      # tolerate either node without caring about the value.
      taints:
        - key: nvidia.com/gpu
          value: t4-gpu
          effect: NoSchedule
      providerSpec:
        value:
          apiVersion: machine.openshift.io/v1beta1
          kind: AWSMachineProviderConfig
          ami:
            id: ami-082a55a580d5538ed
          instanceType: g4dn.2xlarge
          blockDevices:
            - ebs:
                iops: 0
                kmsKey: {}
                volumeSize: 250
                volumeType: gp3
          capacityReservationId: ""
          credentialsSecret:
            name: aws-cloud-credentials
          userDataSecret:
            name: worker-user-data
          deviceIndex: 0
          iamInstanceProfile:
            id: ocp-7hktt-worker-profile
          metadataServiceOptions: {}
          placement:
            availabilityZone: us-east-2a
            region: us-east-2
          securityGroups:
            - filters:
                - name: "tag:Name"
                  values:
                    - ocp-7hktt-node
            - filters:
                - name: "tag:Name"
                  values:
                    - ocp-7hktt-lb
          subnet:
            filters:
              - name: "tag:Name"
                values:
                  - ocp-7hktt-subnet-private-us-east-2a
          tags:
            - name: kubernetes.io/cluster/ocp-7hktt
              value: owned
            - name: Stack
              value: project openshift-cluster-d56bz
            - name: config
              value: openshift-cluster
            - name: guid
              value: d56bz
            - name: owner
              value: unknown
            - name: uuid
              value: 4ab6d869-50bd-5b4b-ad54-ca11f1ad2ad3
