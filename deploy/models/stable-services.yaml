# Stable ClusterIP Services in front of the KServe predictors.
#
# Why these exist: KServe recreates its generated predictor Services on every
# revision. These do not change, so the Envoy clusters and the router config
# can name them once and never be re-pointed after a model redeploy.
#
# Envoy's per-model clusters are STRICT_DNS and resolve these names directly,
# so no ClusterIP ever has to be written into Git.
apiVersion: v1
kind: Service
metadata:
  name: qwen-25-7b-predictor-stable
  namespace: models
  labels:
    app: semantic-router-demo
    component: backend
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  type: ClusterIP
  selector:
    app: isvc.qwen-25-7b-predictor
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: phi-3-mini-chat-predictor-stable
  namespace: models
  labels:
    app: semantic-router-demo
    component: backend
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  type: ClusterIP
  selector:
    app: isvc.phi-3-mini-chat-predictor
  ports:
    - name: http
      port: 8080
      targetPort: 8080
