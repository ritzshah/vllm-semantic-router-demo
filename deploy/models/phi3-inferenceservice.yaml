apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: phi-3-mini-chat
  namespace: models
  annotations:
    openshift.io/display-name: phi-3-mini-chat
    # See the note in qwen-inferenceservice.yaml about Standard vs RawDeployment.
    serving.kserve.io/deploymentMode: Standard
    security.opendatahub.io/enable-auth: "false"
    networking.kserve.io/visibility: exposed
    argocd.argoproj.io/sync-wave: "-4"
spec:
  predictor:
    automountServiceAccountToken: false
    minReplicas: 1
    maxReplicas: 1
    # See the note in qwen-inferenceservice.yaml — match the taint key only.
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    # Pin the small model to the small GPU, leaving the large one entirely to
    # Qwen. The label is published by NVIDIA GPU Feature Discovery. Remove this
    # block on a cluster with uniform GPUs.
    nodeSelector:
      nvidia.com/gpu.product: Tesla-T4
    model:
      modelFormat:
        name: vLLM
      name: ""
      runtime: vllm-cuda-runtime-phi3
      storageUri: hf://microsoft/Phi-3-mini-128k-instruct
      resources:
        requests:
          cpu: "1"
          memory: 4Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "2"
          memory: 6Gi
          nvidia.com/gpu: "1"
      args:
        - --max-model-len
        - "8192"
        - --gpu-memory-utilization
        - "0.90"
        - --max-num-seqs
        - "2"
        # The T4 is Turing (compute capability 7.5) and has no native bfloat16,
        # so vLLM must be told to use float16 explicitly — otherwise it refuses
        # to start on a model whose config declares bfloat16. Drop this on
        # Ampere or newer.
        - --dtype
        - float16
