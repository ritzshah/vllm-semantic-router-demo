<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vLLM Semantic Router — presentation</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23ee0000'/></svg>">
<style>
/*
 * Self-contained presentation. No framework, no CDN, no build step —
 * conference wifi is not a dependency.
 *
 * Slides are laid out on a fixed 1280x720 stage and scaled to fit the
 * viewport, so type size is identical on a laptop and a projector.
 */

:root {
  --bg: #0b0e14;
  --panel: #151b26;
  --panel-2: #1e2636;
  --border: #2e384a;
  --border-bright: #44536e;

  --text: #eef3fa;
  --text-dim: #a3b0c6;
  --text-faint: #6e7d96;

  --accent: #ff4d4d;
  --accent-deep: #ee0000;
  --cyan: #4dd6c8;
  --violet: #b388ff;
  --gold: #ffc857;

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  background: #05070b;
  color: var(--text);
  font-family: var(--sans);
  overflow: hidden;
}

#stage-wrap {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
}

/* Fixed-size stage, scaled by JS. Everything inside uses px against 1280x720. */
#stage {
  width: 1280px; height: 720px;
  position: relative;
  transform-origin: center center;
  background: var(--bg);
  overflow: hidden;
  box-shadow: 0 0 80px rgba(0,0,0,0.6);
}

.slide {
  position: absolute; inset: 0;
  padding: 56px 68px 68px;
  display: none;
  flex-direction: column;
}
.slide.active { display: flex; }

/* thin red rule along the top of every content slide */
.slide:not(.t-title):not(.t-closer)::before {
  content: "";
  position: absolute; top: 0; left: 0;
  width: 190px; height: 5px;
  background: var(--accent-deep);
}

h1.s-title {
  margin: 0 0 6px;
  font-size: 40px; line-height: 1.12;
  font-weight: 750; letter-spacing: -0.022em;
}

p.s-intro {
  margin: 0 0 26px;
  font-size: 19px; line-height: 1.5;
  color: var(--text-dim);
  max-width: 1020px;
}

/* Content hangs from the top rather than floating in the middle — with
   slides of very different heights, a consistent top edge reads better. */
.s-body { flex: 1; min-height: 0; display: flex; flex-direction: column;
          justify-content: flex-start; padding-top: 6px; }

/* ---------------------------------------------------------- title slide */

.t-title { justify-content: center; padding: 0 80px; }
.t-title .eyebrow {
  font-family: var(--mono); font-size: 15px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 26px;
}
.t-title h1 {
  margin: 0; font-size: 66px; line-height: 1.04;
  font-weight: 780; letter-spacing: -0.03em; max-width: 1000px;
}
.t-title .tagline {
  margin: 30px 0 0; font-size: 21px; line-height: 1.55;
  color: var(--text-dim); max-width: 780px;
}
.t-title .rule {
  width: 108px; height: 6px; background: var(--accent-deep);
  margin: 34px 0 0; border-radius: 2px;
}

/* ------------------------------------------------------- statement slide */

.statement-lead {
  font-size: 25px; line-height: 1.45; color: var(--text);
  border-left: 4px solid var(--accent); padding-left: 22px;
  margin: 0 0 30px; max-width: 1040px; font-weight: 500;
}
ul.s-points { margin: 0; padding: 0; list-style: none; max-width: 1060px; }
ul.s-points li {
  position: relative; padding-left: 32px; margin-bottom: 17px;
  font-size: 19px; line-height: 1.5; color: var(--text-dim);
}
ul.s-points li::before {
  content: ""; position: absolute; left: 6px; top: 11px;
  width: 9px; height: 9px; border-radius: 2px; background: var(--accent);
}

/* --------------------------------------------------------- columns slide */

.cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.cols.two { grid-template-columns: repeat(2, 1fr); }
.col {
  background: var(--panel); border: 1px solid var(--border);
  border-top: 3px solid var(--border-bright);
  border-radius: 9px; padding: 20px 20px 22px;
}
.col:nth-child(1) { border-top-color: var(--accent); }
.col:nth-child(2) { border-top-color: var(--cyan); }
.col:nth-child(3) { border-top-color: var(--violet); }
.col h3 { margin: 0 0 11px; font-size: 19px; font-weight: 680; letter-spacing: -0.01em; }
.col p  { margin: 0; font-size: 16px; line-height: 1.55; color: var(--text-dim); }

/* --------------------------------------------------------- pipeline slide */

.pipe { display: flex; align-items: stretch; gap: 0; }
.pipe-step { flex: 1; position: relative; padding-right: 20px; }
.pipe-step:last-child { padding-right: 0; }
.pipe-step .num {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--accent-deep); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 16px; font-weight: 700; margin-bottom: 13px;
}
.pipe-step h3 { margin: 0 0 9px; font-size: 18px; font-weight: 680; }
.pipe-step p  { margin: 0; font-size: 15px; line-height: 1.5; color: var(--text-dim); }
.pipe-step::after {
  content: ""; position: absolute; top: 16px; right: 8px;
  width: 12px; height: 2px; background: var(--border-bright);
}
.pipe-step:last-child::after { display: none; }
.pipe-rail {
  height: 2px; background: linear-gradient(90deg, var(--accent-deep), var(--violet));
  margin: 0 0 26px; border-radius: 1px; opacity: 0.5;
}

/* ---------------------------------------------------------- compare slide */

.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.cmp {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 9px; overflow: hidden;
}
.cmp h3 {
  margin: 0; padding: 14px 20px; font-size: 20px; font-weight: 700;
  background: var(--panel-2); border-bottom: 1px solid var(--border);
}
.cmp.a h3 { color: var(--cyan);   box-shadow: inset 4px 0 0 var(--cyan); }
.cmp.b h3 { color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.cmp ul { margin: 0; padding: 16px 20px 18px; list-style: none; }
.cmp li {
  font-size: 17px; line-height: 1.48; color: var(--text-dim);
  padding: 9px 0; border-bottom: 1px solid var(--border);
}
.cmp li:last-child { border-bottom: none; }

/* ------------------------------------------------------------ table slide */

table.s-table { width: 100%; border-collapse: collapse; font-size: 16px; }
table.s-table th {
  text-align: left; padding: 11px 14px;
  font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); border-bottom: 2px solid var(--border-bright); font-weight: 700;
}
table.s-table td {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  color: var(--text-dim); line-height: 1.45; vertical-align: top;
}
table.s-table tr td:first-child { color: var(--text); font-weight: 600; white-space: nowrap; }
table.s-table code, .mono { font-family: var(--mono); font-size: 14px; color: var(--cyan); }

/* ---------------------------------------------------------------- callout */

.callout {
  margin-top: 22px; padding: 14px 20px;
  background: rgba(255,200,87,0.09);
  border: 1px solid rgba(255,200,87,0.42);
  border-left: 4px solid var(--gold);
  border-radius: 7px;
  font-size: 17px; line-height: 1.5; color: var(--gold);
}

/* ----------------------------------------------------------- closer slide */

.t-closer { align-items: center; justify-content: center; text-align: center; }
.t-closer .term {
  font-family: var(--mono); font-size: 62px; font-weight: 700;
  background: var(--panel-2); border: 2px solid var(--border-bright);
  border-radius: 10px; padding: 26px 48px; letter-spacing: -0.02em;
}
.t-closer .term .caret {
  display: inline-block; width: 26px; height: 56px;
  background: var(--accent); vertical-align: -9px; margin-left: 8px;
  animation: blink 1.1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.t-closer .sub { margin-top: 26px; font-size: 21px; color: var(--text-dim); font-weight: 600; }
.t-closer .links { margin-top: 30px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.t-closer .links span {
  font-family: var(--mono); font-size: 15px; color: var(--text-dim);
  border: 1px solid var(--border); border-radius: 999px; padding: 7px 16px;
}

/* ------------------------------------------------------------- chrome */

.src {
  position: absolute; left: 68px; bottom: 26px;
  font-family: var(--mono); font-size: 12px; color: var(--text-faint);
}
.pageno {
  position: absolute; right: 68px; bottom: 26px;
  font-family: var(--mono); font-size: 13px; color: var(--text-faint);
}
#progress {
  position: absolute; left: 0; bottom: 0; height: 3px;
  background: var(--accent-deep); transition: width 0.22s ease;
}

#notes {
  position: fixed; left: 0; right: 0; bottom: 0;
  max-height: 32vh; overflow-y: auto;
  background: #11161f; border-top: 2px solid var(--accent-deep);
  padding: 16px 26px; font-size: 16px; line-height: 1.6; color: var(--text-dim);
  display: none; z-index: 20;
}
#notes.on { display: block; }
#notes b { color: var(--accent); display: block; font-size: 12px; letter-spacing: 0.1em;
           text-transform: uppercase; margin-bottom: 7px; }

/* Fades out a few seconds in so it is not sitting on the projector all talk;
   any mouse movement brings it back. */
#help {
  position: fixed; top: 14px; right: 16px; z-index: 30;
  font-family: var(--mono); font-size: 12px; color: var(--text-faint);
  background: rgba(10,13,20,0.82); border: 1px solid var(--border);
  border-radius: 6px; padding: 7px 12px;
  transition: opacity 0.6s ease; opacity: 1;
}
#help.idle { opacity: 0; }
#help kbd { color: var(--text-dim); }

/* -------------------------------------------------------------- printing */

@page { size: 1280px 720px; margin: 0; }

@media print {
  html, body { overflow: visible; background: #fff; height: auto; }
  #stage-wrap { position: static; display: block; }
  #stage { width: 1280px; height: auto; transform: none !important; box-shadow: none; }
  #help, #notes, #progress { display: none !important; }
  .slide {
    display: flex !important;
    position: relative; inset: auto;
    width: 1280px; height: 720px;
    page-break-after: always; break-after: page;
  }
}
</style>
</head>
<body>

<div id="help">
  <kbd>←</kbd> <kbd>→</kbd> move · <kbd>n</kbd> notes · <kbd>f</kbd> full · <kbd>p</kbd> pdf
</div>

<div id="stage-wrap"><div id="stage"></div></div>
<div id="notes"></div>

<script src="deck.js"></script>
<script>
'use strict';

const esc = (s) => String(s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* Render `code`-style spans for anything that looks like an identifier. */
const tech = (s) => esc(s).replace(/(vllm-sr\/[a-z0-9-]+|model: &quot;auto&quot;)/g, '<span class="mono">$1</span>');

function chrome(sl, i, n) {
  return (sl.source ? `<div class="src">${esc(sl.source)}</div>` : '') +
         `<div class="pageno">${i + 1} / ${n}</div>`;
}

function renderSlide(sl, i, n) {
  const head = sl.title ? `<h1 class="s-title">${esc(sl.title)}</h1>` : '';
  const intro = sl.intro ? `<p class="s-intro">${tech(sl.intro)}</p>` : '';
  const callout = sl.callout ? `<div class="callout">${esc(sl.callout)}</div>` : '';
  let body = '';

  switch (sl.type) {
    case 'title':
      return `<section class="slide t-title">
        <div class="eyebrow">${esc(sl.subtitle)}</div>
        <h1>${esc(sl.title)}</h1>
        <div class="rule"></div>
        <p class="tagline">${esc(sl.tagline)}</p>
        ${chrome(sl, i, n)}
      </section>`;

    case 'closer':
      return `<section class="slide t-closer">
        <div class="term">&gt; ${esc(sl.title)}<span class="caret"></span></div>
        <div class="sub">${esc(sl.sub)}</div>
        <div class="links">${(sl.links || []).map(l => `<span>${esc(l)}</span>`).join('')}</div>
        ${chrome(sl, i, n)}
      </section>`;

    case 'statement':
      body = `<div class="statement-lead">${esc(sl.lead)}</div>
              <ul class="s-points">${(sl.points || []).map(p => `<li>${tech(p)}</li>`).join('')}</ul>`;
      break;

    case 'columns':
      body = `<div class="cols${(sl.columns || []).length === 2 ? ' two' : ''}">
                ${(sl.columns || []).map(c =>
                  `<div class="col"><h3>${esc(c.heading)}</h3><p>${tech(c.body)}</p></div>`).join('')}
              </div>`;
      break;

    case 'pipeline':
      body = `<div class="pipe-rail"></div>
              <div class="pipe">${(sl.steps || []).map(s =>
                `<div class="pipe-step">
                   <div class="num">${esc(s.n)}</div>
                   <h3>${esc(s.name)}</h3>
                   <p>${tech(s.body)}</p>
                 </div>`).join('')}
              </div>`;
      break;

    case 'compare':
      body = `<div class="compare">
        <div class="cmp a"><h3>${esc(sl.left.heading)}</h3>
          <ul>${sl.left.rows.map(r => `<li>${tech(r)}</li>`).join('')}</ul></div>
        <div class="cmp b"><h3>${esc(sl.right.heading)}</h3>
          <ul>${sl.right.rows.map(r => `<li>${tech(r)}</li>`).join('')}</ul></div>
      </div>`;
      break;

    case 'table':
      body = `<table class="s-table">
        <thead><tr>${sl.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${sl.rows.map(r => `<tr>${r.map(c => `<td>${tech(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>`;
      break;

    default:
      body = `<p class="s-intro">Unknown slide type: ${esc(sl.type)}</p>`;
  }

  return `<section class="slide t-${esc(sl.type)}">
    ${head}${intro}
    <div class="s-body">${body}${callout}</div>
    ${chrome(sl, i, n)}
  </section>`;
}

const stage = document.getElementById('stage');
const notesEl = document.getElementById('notes');
const N = DECK.slides.length;

stage.innerHTML =
  DECK.slides.map((s, i) => renderSlide(s, i, N)).join('') +
  '<div id="progress"></div>';

const slides = Array.from(stage.querySelectorAll('.slide'));
let cur = 0;
let notesOn = false;

function show(i) {
  cur = Math.max(0, Math.min(N - 1, i));
  slides.forEach((s, k) => s.classList.toggle('active', k === cur));
  document.getElementById('progress').style.width = ((cur + 1) / N * 100) + '%';
  const note = DECK.slides[cur].note;
  notesEl.innerHTML = note ? `<b>Presenter note</b>${esc(note)}` : '';
  location.hash = String(cur + 1);
  fit();
}

/* Scale the fixed 1280x720 stage to whatever the window is. */
function fit() {
  const pad = notesOn ? window.innerHeight * 0.34 : 0;
  const availW = window.innerWidth;
  const availH = window.innerHeight - pad;
  const scale = Math.min(availW / 1280, availH / 720);
  stage.style.transform = `scale(${scale})`;
  document.getElementById('stage-wrap').style.paddingBottom = pad + 'px';
}

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  switch (e.key) {
    case 'ArrowRight': case 'PageDown': case ' ': e.preventDefault(); show(cur + 1); break;
    case 'ArrowLeft':  case 'PageUp':           e.preventDefault(); show(cur - 1); break;
    case 'Home': e.preventDefault(); show(0); break;
    case 'End':  e.preventDefault(); show(N - 1); break;
    case 'n': notesOn = !notesOn; notesEl.classList.toggle('on', notesOn); fit(); break;
    case 'f':
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
      break;
    case 'p': window.print(); break;
    default:
      if (/^[0-9]$/.test(e.key)) show(Number(e.key) === 0 ? 9 : Number(e.key) - 1);
  }
});

// Click the right two-thirds to advance, the left third to go back.
stage.addEventListener('click', (e) => {
  const r = stage.getBoundingClientRect();
  show(cur + ((e.clientX - r.left) / r.width < 0.33 ? -1 : 1));
});

// Hide the shortcut hint while presenting; bring it back on any mouse move.
const helpEl = document.getElementById('help');
let idleTimer;
function pokeHelp() {
  helpEl.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => helpEl.classList.add('idle'), 4000);
}
document.addEventListener('mousemove', pokeHelp);
pokeHelp();

window.addEventListener('resize', fit);
window.addEventListener('hashchange', () => {
  const i = parseInt(location.hash.slice(1), 10);
  if (!isNaN(i) && i - 1 !== cur) show(i - 1);
});

const start = parseInt(location.hash.slice(1), 10);
show(isNaN(start) ? 0 : start - 1);
</script>
</body>
</html>
